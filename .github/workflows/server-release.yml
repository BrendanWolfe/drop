name: Build and release server

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      tagName:
        required: false
        type: string
        description: "Optional version tag for this server image."
  release:
    types: [published]
  # This can be used to automatically publish nightlies at UTC nighttime
  schedule:
    - cron: "0 2 * * *" # run at 2 AM UTC

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: server-release-${{ github.event_name == 'schedule' && 'develop' || github.event.release.target_commitish || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      today: ${{ steps.source.outputs.today }}
      branch: ${{ steps.channel.outputs.branch }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      version: ${{ steps.channel.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Test release channel policy
        run: node --test .github/scripts/release-channel.test.mjs

      - name: Resolve release channel
        id: channel
        env:
          DROP_VERSION_FILE: server/package.json
        run: node .github/scripts/release-channel.mjs

      - name: Verify branch provenance
        env:
          RELEASE_BRANCH: ${{ steps.channel.outputs.branch }}
        run: git merge-base --is-ancestor HEAD "origin/$RELEASE_BRANCH"

      - name: Pin the source for every architecture
        id: source
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "today=$(date +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    outputs:
      today: ${{ needs.prepare.outputs.today }}
      branch: ${{ needs.prepare.outputs.branch }}
      prerelease: ${{ needs.prepare.outputs.prerelease }}
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the pinned source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "REGISTRY_IMAGE=${REGISTRY_IMAGE,,}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_DROP_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_GIT_REF=${{ needs.prepare.outputs.commit }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      packages: write
      contents: read
    steps:
      - name: Prepare registry image
        run: echo "REGISTRY_IMAGE=${REGISTRY_IMAGE,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=nightly,enable=${{ needs.build.outputs.prerelease == 'true' }}
            type=raw,value=nightly.${{ needs.build.outputs.today }},enable=${{ needs.build.outputs.prerelease == 'true' }}
            type=raw,value=${{ needs.build.outputs.branch }}
            type=raw,value=${{ needs.build.outputs.version }},enable=${{ needs.build.outputs.prerelease == 'false' }}
            type=raw,value=develop-${{ needs.build.outputs.version }},enable=${{ needs.build.outputs.prerelease == 'true' }}
            type=semver,pattern=v{{version}},value=${{ needs.build.outputs.version }},enable=${{ needs.build.outputs.prerelease == 'false' }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.build.outputs.version }},enable=${{ needs.build.outputs.prerelease == 'false' }}
            type=semver,pattern=v{{major}},value=${{ needs.build.outputs.version }},enable=${{ needs.build.outputs.prerelease == 'false' }}
            type=raw,value=branch-${{ needs.build.outputs.branch }}
            type=raw,value=sha-${{ needs.build.outputs.commit }}
            # set latest tag for stable releases
            type=raw,value=latest,enable=${{ needs.build.outputs.prerelease == 'false' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag_list="$(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          mapfile -t tags <<< "$tag_list"
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          for digest in *; do
            args+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
