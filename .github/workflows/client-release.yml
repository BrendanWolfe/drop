name: Build and release desktop

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      tagName:
        required: false
        type: string
        description: "tagName to be associated with this release."
  release:
    types: [published]

concurrency:
  group: desktop-release-${{ github.event.release.target_commitish || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.channel.outputs.branch }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      tag: ${{ steps.channel.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Test release channel policy
        run: node --test .github/scripts/release-channel.test.mjs

      - name: Resolve release channel
        id: channel
        env:
          DROP_VERSION_FILE: desktop/src-tauri/tauri.conf.json
        run: node .github/scripts/release-channel.mjs

      - name: Verify branch provenance
        env:
          RELEASE_BRANCH: ${{ steps.channel.outputs.branch }}
        run: git merge-base --is-ancestor HEAD "origin/$RELEASE_BRANCH"

      - name: Prepare release and pin its tag to the checked-out commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.channel.outputs.branch }}
          RELEASE_TAG: ${{ steps.channel.outputs.tag }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          EXISTING_RELEASE: ${{ github.event.release.id }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" || { echo "Release tag belongs to a different commit; bump the application version before publishing again"; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$(git rev-parse HEAD)"
          fi
          if ! gh release view "$RELEASE_TAG" --json apiUrl > /dev/null; then
            args=(--target "$RELEASE_BRANCH" --title "Desktop $RELEASE_TAG" --notes "Desktop build from commit $GITHUB_SHA ($RELEASE_BRANCH)." --draft --verify-tag)
            if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          release_url=$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)
          gh api "$release_url" > "$RUNNER_TEMP/drop-release.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/drop-release.json`, 'utf8'));
          if (release.target_commitish !== process.env.RELEASE_BRANCH || release.prerelease !== (process.env.PRERELEASE === 'true')) throw new Error('Existing release has a different channel');
          if (!process.env.EXISTING_RELEASE && !release.draft) throw new Error('Do not overwrite a published release; bump the application version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_id=${release.id}\n`);
          NODE

  publish-tauri:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: --target aarch64-unknown-linux-gnu
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Test desktop release configuration
        run: node --experimental-strip-types --test desktop/main/tests/desktop-release.test.ts desktop/main/tests/cloud-saves.test.ts

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libarchive-dev librsvg2-dev patchelf pkg-config xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --filter drop-app... --filter my-nuxt-layer...

      - name: Install Windows archive libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "libarchive[core,bzip2,lz4,lzma,zstd]:x64-windows-static-md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          "LIBARCHIVE_STATIC=1" >> $env:GITHUB_ENV
          "LIBARCHIVE_LIB_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/lib" >> $env:GITHUB_ENV
          "LIBARCHIVE_INCLUDE_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/include" >> $env:GITHUB_ENV

      - name: Test Steam shortcut file safety
        working-directory: desktop/src-tauri
        run: cargo test --locked -p steam_shortcuts

      - name: Test startup authorization safety
        working-directory: desktop/src-tauri
        run: cargo test --locked -p remote --lib

      - name: Test cloud save snapshots and conflicts
        working-directory: desktop/src-tauri
        run: cargo test --locked -p cloud_saves

      - name: Configure signed desktop updates
        id: updater-config
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          DROP_UPDATER_PUBLIC_KEY: ${{ secrets.DROP_UPDATER_PUBLIC_KEY }}
          DROP_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Set the TAURI_SIGNING_PRIVATE_KEY repository secret"; exit 1; }
          test -n "$DROP_UPDATER_PUBLIC_KEY" || { echo "Set the DROP_UPDATER_PUBLIC_KEY repository secret"; exit 1; }
          node .github/scripts/configure-desktop-updater.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DROP_UPDATER_PUBLIC_KEY: ${{ secrets.DROP_UPDATER_PUBLIC_KEY }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ env.DROP_RELEASE_TAG }}
          releaseName: ${{ github.event.release.name || format('Desktop {0}', needs.prepare.outputs.tag) }}
          releaseBody: ${{ github.event.release.body || format('Desktop build from commit {0}. Download the installer for your platform below.', github.sha) }}
          releaseCommitish: ${{ needs.prepare.outputs.branch }}
          releaseDraft: ${{ github.event_name != 'release' }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          # Dev builds remain manually installable, but cannot reach old updaters either.
          includeUpdaterJson: ${{ needs.prepare.outputs.prerelease == 'false' }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
          projectPath: ./desktop

  publish-release:
    needs: [prepare, publish-tauri]
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish only after every desktop platform succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          STABLE: ${{ needs.prepare.outputs.prerelease == 'false' }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest="$STABLE"
