name: Build and release desktop

on:
  workflow_dispatch:
    inputs:
      tagName:
        required: false
        type: string
        description: "tagName to be associated with this release."
  release:
    types: [published]

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: --target aarch64-unknown-linux-gnu
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libarchive-dev librsvg2-dev patchelf pkg-config xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --filter drop-app... --filter my-nuxt-layer...

      - name: Install Windows archive libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "libarchive[core,bzip2,lz4,lzma,zstd]:x64-windows-static-md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          "LIBARCHIVE_STATIC=1" >> $env:GITHUB_ENV
          "LIBARCHIVE_LIB_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/lib" >> $env:GITHUB_ENV
          "LIBARCHIVE_INCLUDE_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/include" >> $env:GITHUB_ENV

      - name: Test Steam shortcut file safety
        working-directory: desktop/src-tauri
        run: cargo test --locked -p steam_shortcuts

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true
        with:
          releaseId: ${{ github.event.release.id || '' }}
          tagName: ${{ github.event.release.tag_name || inputs.tagName || format('v__VERSION__-build.{0}', github.run_number) }}
          releaseName: ${{ github.event.release.name || format('Desktop v__VERSION__ (build {0})', github.run_number) }}
          releaseBody: ${{ github.event.release.body || format('Desktop build from commit {0}. Download the installer for your platform below.', github.sha) }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: ${{ github.event_name != 'release' || github.event.release.prerelease }}
          args: ${{ matrix.args }}
          projectPath: ./desktop
