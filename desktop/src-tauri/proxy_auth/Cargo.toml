[package]
name = "proxy_auth"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
http = "1.3.1"
keyring = { version = "3.6.3", features = ["apple-native", "crypto-rust", "linux-native-sync-persistent", "windows-native"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
reqwest-middleware = "0.4.2"
reqwest-websocket = "0.5.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
url = "2.5.7"

[dev-dependencies]
anyhow = "1"
log = "0.4"
log4rs = "1.3.0"
serde_with = "3.15.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
